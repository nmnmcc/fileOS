# SPDX-License-Identifier: AGPL-3.0-only
#
# Python is used only for the helper scripts in scripts/. Not a package.

[project]
name = "fileos-scripts"
version = "0.0.0"
description = "Development and CI scripts for fileOS"
license = "AGPL-3.0-only"
requires-python = "==3.14.*"
dependencies = ["typer>=0.29.2"]

[dependency-groups]
dev = ["basedpyright>=1.40.2"]

[tool.uv]
package = false

[tool.basedpyright]
include = ["scripts"]
# pyright's "standard" mode: the level of type safety every script must reach.
typeCheckingMode = "standard"
pythonVersion = "3.14"
