# SPDX-License-Identifier: AGPL-3.0-only

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["apps"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
publish = false

# Internal crates. Dependencies go down only; see CONTRIBUTING.md.
# Every external dependency must be added here, with `default-features = false`,
# after review (see "Dependency policy" in CONTRIBUTING.md).
#
# The WebAssembly apps and engines are in their own workspace, in apps/.
[workspace.dependencies]
fos-core = { path = "crates/fos-core" }
fos-fs = { path = "crates/fos-fs" }
fos-id = { path = "crates/fos-id" }
fos-sync = { path = "crates/fos-sync" }
fos-store = { path = "crates/fos-store" }
fos-runtime = { path = "crates/fos-runtime" }
fos-net = { path = "crates/fos-net" }
fos-gateway = { path = "crates/fos-gateway" }
fos-node = { path = "crates/fos-node" }

# Formats and keys. All of them build for wasm32-unknown-unknown.
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
# The same version as libp2p-identity, so there is one copy.
ed25519-dalek = { version = "3.0.0", default-features = false, features = [
  "fast",
  "zeroize",
] }
serde = { version = "1.0.229", default-features = false, features = [
  "std",
  "derive",
] }
# CBOR. libp2p's request-response uses the same crate for its CBOR codec.
cbor4ii = { version = "1.2.5", default-features = false, features = [
  "serde1",
  "use_std",
] }
# The manifest of an .app folder.
toml = { version = "1.2.3", default-features = false, features = [
  "std",
  "parse",
  "serde",
] }
getrandom = { version = "0.3.4", default-features = false, features = ["std"] }

# The app runtime. We do not make our own (see the fileOS design page).
wasmtime = { version = "51.0.0", default-features = false, features = [
  "std",
  "runtime",
  "cranelift",
  "component-model",
] }
# The network. We do not make our own (see the fileOS design page).
# No "quic" for now: libp2p-quic always turns on quinn's aws-lc-rs backend,
# and aws-lc-sys is not allowed (deny.toml). TCP with Noise and Yamux does the
# same work; relays and hole punching (DCUtR) work over TCP too.
libp2p = { version = "0.57.1", default-features = false, features = [
  "tokio",
  "tcp",
  "noise",
  "yamux",
  "identify",
  "ping",
  "mdns",
  "relay",
  "dcutr",
  "autonat",
  "request-response",
  "cbor",
  "macros",
  "ed25519",
] }

tokio = { version = "1.54.1", default-features = false, features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "time",
  "sync",
  "macros",
  "signal",
] }
hyper = { version = "1.13.0", default-features = false, features = [
  "server",
  "http1",
] }
hyper-util = { version = "0.1.21", default-features = false, features = [
  "tokio",
] }
percent-encoding = { version = "2.3.2", default-features = false, features = [
  "std",
] }
http-body-util = { version = "0.1.5", default-features = false }
bytes = { version = "1.12.2", default-features = false, features = ["std"] }
clap = { version = "4.6.10", default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
  "suggestions",
  "derive",
  "env",
] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "fmt",
  "env-filter",
] }
tempfile = { version = "3.27.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
todo = "warn"
too_long_first_doc_paragraph = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
literal_string_with_formatting_args = "allow" # Structured logging uses message templates.

# The rules for duplicate dependencies, and their few exceptions, are in deny.toml.
multiple_crate_versions = "allow"
# Public contracts use clear must-use annotations where dropping a value is a bug.
must_use_candidate = "allow"
# The wire and storage formats mix integer widths and signedness on purpose.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Protocol code uses the usual names, and writes field layouts out as they are.
case_sensitive_file_extension_comparisons = "allow"
decimal_bitwise_operands = "allow"
many_single_char_names = "allow"
similar_names = "allow"
struct_field_names = "allow"
# These patterns keep the existing protocol code readable.
format_collect = "allow"
format_push_string = "allow"
map_unwrap_or = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"

# Compile time is a feature. These settings keep debug builds and links quick.
[profile.dev]
debug = "line-tables-only"

# Dependencies are compiled once and cached. A little optimization makes tests faster.
[profile.dev.package."*"]
opt-level = 1

# Not for wasmtime's compiler: it is the longest part of a clean build, and
# with no optimization it builds about a third faster. Debug builds then
# compile WebAssembly a little more slowly, which tests do not see.
[profile.dev.package.cranelift-codegen]
opt-level = 0

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 0

[profile.release]
lto = "thin"
strip = true

[profile.bench]
debug = "line-tables-only"
strip = false
