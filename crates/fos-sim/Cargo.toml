[package]
name = "fos-sim"
description = "Deterministic simulation of many fileOS nodes, for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-util = ["dep:fos-core", "dep:fos-space"]

[dependencies]
fos-core = { workspace = true, optional = true }
fos-space = { workspace = true, optional = true }

[dev-dependencies]
fos-core.workspace = true
fos-space.workspace = true

fos-id.workspace = true

[[bench]]
name = "sync"
harness = false
required-features = ["test-util"]

[lints]
workspace = true
