# SPDX-License-Identifier: AGPL-3.0-only

[package]
name = "hs-identity"
description = "Key-based identity, devices and account migration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Built for wasm32-unknown-unknown too; see CONTRIBUTING.md.
[package.metadata.hs]
portable = true

[dependencies]
hs-core.workspace = true
ring.workspace = true
serde_json.workspace = true

# ring needs a source of randomness in the browser, even though this crate never asks for one.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ring = { workspace = true, features = ["wasm32_unknown_unknown_js"] }

[lints]
workspace = true
