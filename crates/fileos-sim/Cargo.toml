[package]
name = "fileos-sim"
description = "Deterministic simulation of many fileOS nodes, for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-util = ["dep:fileos-core", "dep:fileos-space"]

[dependencies]
fileos-core = { workspace = true, optional = true }
fileos-space = { workspace = true, optional = true }

[dev-dependencies]
fileos-core.workspace = true
fileos-space.workspace = true

fileos-id.workspace = true

[[bench]]
name = "sync"
harness = false
required-features = ["test-util"]

[lints]
workspace = true
