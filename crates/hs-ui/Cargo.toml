# SPDX-License-Identifier: AGPL-3.0-only

# The web interface, a Native Shell app in Rust. It is its own workspace, so
# its dependencies (Native Shell and what that brings in, RustCrypto's sha2
# among them) are never part of the server's build or its dependency budget.
# `nsh package --target web` builds it; `hs` embeds the result.

[package]
name = "hs-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
nsh-core = { version = "0.7.0", default-features = false }
nsh-base = { version = "0.7.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = [
  "std",
  "derive",
] }
serde_json = { version = "1.0.154", default-features = false, features = [
  "std",
] }

[dev-dependencies]
nsh-engine = { version = "0.7.0", default-features = false }
nsh-testing = { version = "0.7.0", default-features = false }

# The server workspace's lints (without `cargo`: this crate is not published).
[lints.rust]
# `#[component]` functions are named as types (`App`).
non_snake_case = "allow"
unsafe_code = "deny"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
too_long_first_doc_paragraph = "warn"
undocumented_unsafe_blocks = "warn"

# The dependency duplicate policy and its narrow exceptions live in deny.toml.
multiple_crate_versions = "allow"
# Public contracts use explicit must-use annotations where discarding a value is a bug.
must_use_candidate = "allow"
# The wire and storage formats use deliberately mixed integer widths and signedness.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Protocol implementations use conventional names and literal field layouts.
case_sensitive_file_extension_comparisons = "allow"
decimal_bitwise_operands = "allow"
many_single_char_names = "allow"
similar_names = "allow"
struct_field_names = "allow"
# These patterns preserve readability across the existing protocol implementations.
format_collect = "allow"
format_push_string = "allow"
map_unwrap_or = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
