# SPDX-License-Identifier: AGPL-3.0-only
#
# Every job runs inside Nix, through the same devenv.nix contributors use.
# Nothing here depends on tools preinstalled on the runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # fmt, clippy, tests and cargo-deny: the `check` script in devenv.nix.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
      - run: devenv shell -- check

  # Compile time is a feature: a PR that blows the budget fails like a failing test.
  build-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
      - run: devenv shell -- budget
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-timings
          path: target/cargo-timings/cargo-timing.html

  # Release artifacts, built in the Nix sandbox exactly as `devenv build` does locally.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/devenv
      - run: devenv shell -- artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: hs-linux-x86_64
          path: artifacts/hs
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: artifacts/docs

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/devenv
      - run: devenv shell -- dco "origin/${{ github.base_ref }}" HEAD
