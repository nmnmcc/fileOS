# SPDX-License-Identifier: AGPL-3.0-only
#
# Every job runs inside Nix, through the same devenv.nix contributors use.
# Nothing here needs tools that are already installed on the runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a new release after CI passes on main
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request stops its older run. Runs on main always go to
# the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatting, lints, tests, docs, the wasm build, dependency policy and Python
  # types: scripts/check.py.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devenv
      - name: Find the Rust tools in devenv
        run: |
          devenv shell -- bash -e <<'BASH'
          dirname "$(command -v rustc)" >> "$GITHUB_PATH"
          BASH
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          key: ${{ hashFiles('devenv.lock', 'devenv.nix', 'devenv.yaml') }}
          workspaces: |
            .
            apps
      - run: devenv shell -- check --group standard

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devenv
      - run: devenv shell -- check --group msrv

  # Fails if a build goes over its compile-time budget (scripts/budget.py).
  budget:
    name: budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devenv
      - run: devenv shell -- budget
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-timings
          path: target/cargo-timings/cargo-timing.html
          overwrite: true

  # Release artifacts, built in the Nix sandbox in the same way as a local `devenv build`.
  artifacts:
    name: artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      fileos: ${{ steps.fileos.outputs.artifact-id }}
      docs: ${{ steps.docs.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/devenv
      - run: devenv shell -- artifacts
      - name: Pack the release files
        id: package
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          name="fileos-$version-linux-x86_64"
          mkdir "$name" release
          cp -rP artifacts/fileos artifacts/apps LICENSE PLUGIN-EXCEPTION.md README.md CHANGELOG.md "$name/"
          tar -czf "release/$name.tar.gz" "$name"
          tar -czf "release/fileos-docs-$version.tar.gz" -C artifacts docs
      - uses: actions/upload-artifact@v7
        id: fileos
        with:
          name: fileos-linux-x86_64
          path: release/fileos-${{ steps.package.outputs.version }}-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - uses: actions/upload-artifact@v7
        id: docs
        with:
          name: docs
          path: release/fileos-docs-${{ steps.package.outputs.version }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  # Every commit in a pull request has a sign-off (CONTRIBUTING.md).
  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/devenv
      - run: devenv shell -- dco "origin/${{ github.base_ref }}" HEAD

  # The branch rules need this check. It passes when the checks it needs pass
  # or are skipped.
  ci:
    name: ci
    if: always()
    needs: [check, msrv, budget, artifacts, dco]
    runs-on: ubuntu-latest
    steps:
      - env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$JOB_RESULTS"

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.release)
    needs: [ci, artifacts]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.artifacts.outputs.version }}
      artifact-ids: ${{ needs.artifacts.outputs.fileos }},${{ needs.artifacts.outputs.docs }}
