# SPDX-License-Identifier: AGPL-3.0-only
#
# CI calls this workflow after its checks pass on main. It uses the files
# from the same run. Knope makes the tag and GitHub release for a new version.

name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      artifact-ids:
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Check for a new version
        id: version
        run: |
          test -n "$VERSION"
          status=0
          git ls-remote --exit-code --refs origin "refs/tags/v$VERSION" > /dev/null || status=$?
          case "$status" in
            0) echo "Tag v$VERSION already exists." ;;
            2) echo "new=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - uses: actions/download-artifact@v8
        if: steps.version.outputs.new == 'true'
        with:
          artifact-ids: ${{ inputs.artifact-ids }}
          path: release
          merge-multiple: true
      - name: Write the checksums
        if: steps.version.outputs.new == 'true'
        working-directory: release
        run: sha256sum "./fileos-docs-$VERSION.tar.gz" "./fos-$VERSION-linux-x86_64.tar.gz" > SHA256SUMS
      - uses: ./.github/actions/devenv
        if: steps.version.outputs.new == 'true'
      - run: devenv shell -- knope release
        if: steps.version.outputs.new == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
