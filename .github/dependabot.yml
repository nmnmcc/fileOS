# SPDX-License-Identifier: AGPL-3.0-only
#
# Dependency updates. Minor and patch updates come together in one pull
# request for each ecosystem. Major updates come one at a time, because a new
# major version is checked like a new dependency (CONTRIBUTING.md, "Dependency
# policy"). Security updates are separate and come at any time.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI:"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: [minor, patch]
    commit-message:
      prefix: "Cargo:"

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      docs:
        update-types: [minor, patch]
    commit-message:
      prefix: "Docs:"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "Scripts:"
