# SPDX-License-Identifier: AGPL-3.0-only
# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; it comes from netlink (Linux only), through if-watch in libp2p" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# The allow list is a rule. It does not describe the dependencies we have now.
unused-allowed-license = "allow"
# Only licenses that work with AGPL-3.0-only.
# GPL-2.0-only does not work with it and must never be added.
allow = [
  "AGPL-3.0-only",
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  # jpeg-encoder (thumbnails). FSF-free and GPL-compatible. Binary
  # distributions give credit to the Independent JPEG Group (see README).
  "IJG",
]

[bans]
# The same crate in two versions is compiled twice.
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl-sys", reason = "C build dependency; use rustls with the ring backend" },
  { crate = "aws-lc-sys", reason = "needs cmake/clang and is slow to build; use rustls with the ring backend" },
  # wasmtime and its WASI crates use it inside; our code must not.
  { crate = "async-trait", wrappers = [
    "wasmtime",
    "wasmtime-wasi",
    "wasmtime-wasi-io",
    "wasmtime-wasi-http",
  ], reason = "native async fn in traits is stable" },
]
# Duplicates we cannot take out: each comes from an upstream crate.
skip = [
  # libp2p-noise (snow) and cranelift are on the older RustCrypto crates;
  # ed25519-dalek 3 (libp2p-identity) is on the newer ones.
  { crate = "block-buffer@0.10.4", reason = "snow, cranelift-codegen (sha2 0.10)" },
  { crate = "chacha20@0.9.1", reason = "snow" },
  { crate = "cpufeatures@0.2.17", reason = "snow, sha2 0.10" },
  { crate = "crypto-common@0.1.7", reason = "snow, sha2 0.10" },
  { crate = "curve25519-dalek@4.1.3", reason = "snow" },
  { crate = "digest@0.10.7", reason = "snow, sha2 0.10" },
  { crate = "fiat-crypto@0.2.9", reason = "curve25519-dalek 4, for snow" },
  { crate = "sha2@0.10.9", reason = "snow, cranelift-codegen" },
  { crate = "getrandom@0.2.17", reason = "ring" },
  { crate = "getrandom@0.3.4", reason = "libp2p-noise and snow; libp2p itself is on 0.4" },
  { crate = "r-efi@5.3.0", reason = "getrandom 0.3, on UEFI only" },
  { crate = "thiserror@1.0.69", reason = "rtnetlink (Linux only), through if-watch in libp2p" },
  { crate = "thiserror-impl@1.0.69", reason = "rtnetlink (Linux only), through if-watch in libp2p" },
  { crate = "hashbrown@0.16.1", reason = "gimli, in wasmtime; indexmap is on the newer one" },
  { crate = "syn@2.0.119", reason = "proc macros upstream (libp2p, curve25519-dalek, jni); serde is on syn 3" },
  # The host and guest tools pin different versions of the same formats.
  { crate = "wasm-encoder@0.262.0", reason = "wit-bindgen 0.63; Wasmtime 51 uses 0.263" },
  { crate = "wasm-metadata@0.262.0", reason = "wit-bindgen 0.63; Wasmtime 51 uses 0.263" },
  { crate = "wasmparser@0.262.0", reason = "wit-bindgen 0.63; Wasmtime 51 uses 0.263" },
  { crate = "wit-component@0.262.0", reason = "wit-bindgen 0.63; Wasmtime 51 uses 0.263" },
  { crate = "wit-parser@0.262.0", reason = "wit-bindgen 0.63; Wasmtime 51 uses 0.263" },
  { crate = "wit-bindgen@0.57.1", reason = "wasip2 in the host dependency tree" },
  { crate = "windows-sys@0.52.0", reason = "ring, on Windows only" },
  # hpke (encryption of spaces) is on the newer RustCrypto crates; snow, in
  # libp2p-noise, is on the older ones.
  { crate = "aead@0.5.2", reason = "snow" },
  { crate = "chacha20poly1305@0.10.1", reason = "snow" },
  { crate = "cipher@0.4.4", reason = "snow" },
  { crate = "inout@0.1.4", reason = "snow" },
  { crate = "poly1305@0.8.0", reason = "snow" },
  { crate = "universal-hash@0.5.1", reason = "snow" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
