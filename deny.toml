# SPDX-License-Identifier: AGPL-3.0-only
# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
# The allow list is a rule. It does not describe the dependencies we have now.
unused-allowed-license = "allow"
# Only licenses that work with AGPL-3.0-only.
# GPL-2.0-only does not work with it and must never be added.
allow = [
  "AGPL-3.0-only",
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  # jpeg-encoder (thumbnails). FSF-free and GPL-compatible. Binary
  # distributions give credit to the Independent JPEG Group (see README).
  "IJG",
]

[bans]
# The same crate in two versions is compiled twice.
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl-sys", reason = "C build dependency; use rustls with the ring backend" },
  { crate = "aws-lc-sys", reason = "needs cmake/clang and is slow to build; use rustls with the ring backend" },
  { crate = "async-trait", reason = "native async fn in traits is stable" },
]
# Duplicates we cannot take out: each comes from an upstream default.
skip = [
  { crate = "base64@0.22.1", reason = "sqlx-core; rcgen's pem is on the newer one" },
  { crate = "hashbrown@0.16.1", reason = "sqlx-core's hashlink; indexmap is on the newer one" },
  { crate = "syn@2.0.119", reason = "tracing-attributes, through sqlx-core's tracing defaults" },
  { crate = "windows-sys@0.52.0", reason = "ring, on Windows only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
