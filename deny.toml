# SPDX-License-Identifier: AGPL-3.0-only
# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
# The allow list is policy, not a description of current dependencies.
unused-allowed-license = "allow"
# Only licenses compatible with AGPL-3.0-only.
# GPL-2.0-only is incompatible and must never be added.
allow = [
  "AGPL-3.0-only",
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
# The same crate in two versions is compiled twice.
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl-sys", reason = "C build dependency; use rustls with the ring backend" },
  { crate = "aws-lc-sys", reason = "needs cmake/clang and is slow to build; use rustls with the ring backend" },
  { crate = "async-trait", reason = "native async fn in traits is stable" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
