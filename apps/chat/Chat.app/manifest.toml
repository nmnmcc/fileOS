id = "chat"
name = "Chat"
kind = "app"
version = "0.1.0"
build = 1
requires = "fileos:app@0.1.0"
main = "bin/app.wasm"

[[permissions]]
path = "/chat"
access = "read-write"
reason = "reason.chat"

[[watch]]
path = "/chat"

# Pictures that other apps share with the chat app.
[[watch]]
path = "/granted"

[[receives]]
filter = ["*.jpg", "*.jpeg", "*.png"]
