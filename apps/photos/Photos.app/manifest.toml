id = "photos"
name = "Photos"
kind = "app"
version = "0.1.0"
build = 1
requires = "fileos:app@0.1.0"
main = "bin/app.wasm"

[[permissions]]
path = "/photos"
access = "read-write"
reason = "reason.photos"

[[watch]]
path = "/photos"

# Once a day, index every photo again, in case a change was missed.
[[schedule]]
name = "reindex"
every = "1d"
